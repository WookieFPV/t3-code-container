# Ansible configuration for provisioning this box from itself.
#
# The playbooks run with connection: local, against the machine they are sitting
# on. There is no control node, no inventory of IPs and no SSH into the
# container — provision.sh copies this tree in and runs ansible-playbook there.
# That keeps the property the bash version had: anything with systemd and root
# can provision itself from a checkout, with no infrastructure around it.
#
# ansible-core only, deliberately. Every collection added here becomes something
# provision.sh has to fetch before it can do anything, on a box that may only
# have the distribution's package manager. community.general would give us
# timezone, locale_gen and npm modules; they save perhaps thirty lines between
# them and cost a galaxy install on every fresh container. Not worth it.

[defaults]
inventory            = inventory/local.yml
roles_path           = roles
# Not `stdout_callback = yaml`: that callback moved out of ansible-core into
# community.general, so on a current ansible-core it fails to load and takes the
# whole config with it. This is the in-core replacement — same readable
# multi-line output for anything a task returns, no collection required.
callback_result_format = yaml
# Skipped tasks are the normal case here: every role is tagged, and a run
# limited with --tags prints one line per skipped task otherwise.
display_skipped_hosts = False
# Neither is a task that checked a condition and found it already true worth a
# line. Most of a converged re-run is those; what changed and what failed is
# not, and gets lost among them. `ok` tasks with a result to show — the debug
# tasks that say what this is running on and what to do next — still print, as
# does everything else, under callback_plugins/concise.py. Run with -v (or set
# this back to True) for the full task-by-task output.
display_ok_hosts     = False
callback_plugins     = callback_plugins
stdout_callback      = concise
# The playbooks address exactly one host and every task is ordered, so the
# host name in front of each line is noise.
show_per_host_start  = False
interpreter_python   = auto_silent
retry_files_enabled  = False
# A handler that never runs because an earlier task failed leaves the box in a
# worse state than one that does — a stale systemd daemon-reload in particular.
force_handlers       = True

[privilege_escalation]
# provision.sh already refuses to run as anything but root, so escalation here
# is only ever root -> the unprivileged app user, which needs no password.
become_ask_pass = False
# `su`, not Ansible's default of sudo. This repo's whole point is a box where
# the app user has no sudo (docs/design.md, "Non-root by design"), and the
# container images it targets do not ship the package at all — a fresh Debian
# LXC has no /usr/bin/sudo. With the default, every task that drops to the app
# user dies with "Premature end of stream waiting for become success" and
# "/bin/sh: 1: sudo: not found" buried in stderr, seventy tasks into the run.
#
# su is util-linux, so it is present on every distribution here, and root -> a
# named user needs no password (pam_rootok). Installing sudo instead would work
# and would not by itself grant the app user anything — but it puts a setuid
# root binary on a box designed not to have one, to replace a tool that is
# already installed. tasks/preflight.yml checks for it up front; if you do
# change this, change become_tool in inventory/group_vars/all.yml to match.
become_method = su
