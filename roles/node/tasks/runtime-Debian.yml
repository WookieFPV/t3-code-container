---
# Debian's own nodejs package is far too old; NodeSource is the vendor repo.

- name: NodeSource signing key
  ansible.builtin.include_role:
    name: keyring
  vars:
    keyring_name: NodeSource
    keyring_url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    keyring_dest: "{{ node_keyring }}"
    keyring_fingerprints: "{{ node_keyring_fingerprints }}"

- name: NodeSource repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://deb.nodesource.com/node_{{ node_major }}.x
      Suites: nodistro
      Components: main
      Architectures: {{ apt_arch }}
      Signed-By: {{ node_keyring }}
  register: node_repo

- name: Refresh the apt index for the new repository
  ansible.builtin.apt:
    update_cache: true
  when: node_repo.changed

# `state: latest`, not `present`. On an image that already carries Debian's own
# nodejs, "already installed" is exactly the wrong answer — NodeSource is here
# precisely because that one is too old, and `present` would leave it in place
# forever. Scoped to this one package, so it is not a general upgrade.
- name: Install Node.js from NodeSource  # noqa package-latest
  ansible.builtin.apt:
    name: nodejs
    state: latest
