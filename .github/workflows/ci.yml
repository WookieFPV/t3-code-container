name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          # --severity=warning: the info level is style advice (prefer find over
          # ls, quote a variable that is always a number) and blocking a merge on
          # it trains people to stop reading the output. Warnings and errors are
          # the ones that have ever been real here.
          #
          # Far less shell than there used to be: the library layer is Ansible's
          # job now. What is left is the bootstrap, the Proxmox helper, the tests
          # and the handful of scripts the roles ship deliberately.
          shellcheck --severity=warning --external-sources --source-path=SCRIPTDIR \
            provision.sh \
            pve/*.sh \
            test/*.sh \
            roles/*/files/*.sh

      - name: unit tests
        run: ./test/unit.sh

      - name: install ansible and the linters
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core ansible-lint yamllint

      - name: yamllint
        run: yamllint .

      - name: syntax check every profile
        run: |
          for p in playbooks/*.yml; do
            echo "== $p"
            ansible-playbook "$p" --syntax-check
          done

      # Ansible only reads group_vars/ when it sits beside the inventory or
      # beside the playbook. At the repo root it is ignored *silently*, and
      # every setting in it is undefined — which --syntax-check and ansible-lint
      # both pass happily. This caught exactly that, once.
      - name: the shared settings actually resolve
        run: |
          ansible -i inventory/local.yml localhost \
            -m debug -a "msg={{ app_user }}|{{ npm_prefix }}|{{ npm_major }}" | tee /tmp/vars
          grep -q 'devuser|/home/devuser/.local|12' /tmp/vars

      # --only is the reason the playbooks carry per-role tags instead of
      # declaring role dependencies. If a dependency ever creeps into a
      # meta/main.yml, --tags claude silently starts running base and user too.
      - name: --only selects one role and nothing else
        run: |
          ansible-playbook playbooks/t3.yml --tags claude --list-tasks > /tmp/tags
          grep -q 'claude : Install Claude Code' /tmp/tags
          ! grep -qE '^ +(base|user|node) : ' /tmp/tags

      - name: ansible-lint
        run: |
          ansible-lint && exit 0
          # ansible-lint's summary line names the first reserved word out of the
          # schema's own regex rather than the key that actually failed, which
          # makes a schema[vars] finding close to unreadable. Dump the machine
          # format and the parsed document when it fails, so the next person
          # does not have to guess at which key upset it.
          echo "::group::ansible-lint diagnostics"
          ansible-lint --version
          ansible-lint -f json || true
          python3 -c "
          import yaml
          d = yaml.safe_load(open('inventory/group_vars/all.yml'))
          print('top-level keys:', sorted(d))
          "
          echo "::endgroup::"
          exit 1

  # The package layer, on every family we claim to name packages for. No
  # systemd, so this is limited to the base role — which is exactly the role
  # that touches package names, locales and timezones.
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: "debian:12", tier: 1}
          - {image: "debian:13", tier: 1}
          - {image: "ubuntu:24.04", tier: 1}
          - {image: "fedora:latest", tier: 2}
          - {image: "archlinux:latest", tier: 2}
    runs-on: ubuntu-latest
    # Tier 2 is best effort by policy, so it reports without failing the build.
    continue-on-error: ${{ matrix.tier == 2 }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: bootstrap enough to check out
        shell: bash
        run: |
          set -eux
          if   command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y git ca-certificates
          elif command -v dnf     >/dev/null; then dnf install -y git
          elif command -v pacman  >/dev/null; then pacman -Sy --noconfirm git
          fi

      - uses: actions/checkout@v4

      # provision.sh installs ansible-core itself on a real container. Doing it
      # as its own step here keeps a package-manager failure distinguishable
      # from a playbook failure in the log.
      - name: install ansible
        run: ./provision.sh --list >/dev/null || true

      - name: install base, twice
        run: ./test/install-check.sh --only base

  # The full minimal profile, which needs a real PID 1 — the app user's linger
  # session and /run/user/UID do not exist without one. Tier 1 only.
  systemd:
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:24.04"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build a systemd image
        run: |
          cat >Dockerfile.ci <<EOF
          FROM ${{ matrix.image }}
          ENV DEBIAN_FRONTEND=noninteractive
          # purge sudo: the Ubuntu images ship it and the Debian ones do not,
          # and a real LXC container is the Debian case. Ansible's default
          # become_method is sudo, so leaving it installed on half the matrix
          # would let the privilege drop to the app user break on the hardware
          # this repo exists for while CI stayed green. It did, once.
          RUN apt-get update && apt-get install -y systemd systemd-sysv dbus git ca-certificates \
              && apt-get purge -y sudo \
              && rm -rf /var/lib/apt/lists/*
          CMD ["/sbin/init"]
          EOF
          docker build -f Dockerfile.ci -t provision-ci .

      - name: boot it
        run: |
          docker run -d --name ci --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/repo" -w /repo provision-ci
          # systemd needs a moment before loginctl will answer. "degraded" is a
          # non-zero exit but a perfectly usable boot in a container, where a
          # handful of units have nothing to manage — so match on the word.
          for _ in $(seq 60); do
            state=$(docker exec ci systemctl is-system-running 2>/dev/null || true)
            case $state in running|degraded) break ;; esac
            sleep 1
          done
          echo "system state: ${state:-unknown}"
          case ${state:-} in running|degraded) ;; *) docker logs ci; exit 1 ;; esac
          docker exec ci systemctl --version | head -1

      - name: install the minimal profile, twice
        run: docker exec ci ./test/install-check.sh --profile minimal

      - name: the app user has a working systemd session
        run: |
          docker exec ci bash -c '
            set -eux
            id devuser
            [ "$(loginctl show-user devuser -p Linger --value)" = yes ]
            test -d /run/user/$(id -u devuser)
            runuser -u devuser -- env XDG_RUNTIME_DIR=/run/user/$(id -u devuser) \
              systemctl --user is-system-running --wait
          '

      # The minimal profile is base + user, and neither role ever runs anything
      # as the app user — so nothing above this exercises the privilege drop
      # that the node, bun, claude, t3 and t3-service roles are built on. Do it
      # explicitly, with the same config a real run uses, on an image with no
      # sudo. Without this the whole class is untested.
      - name: becoming the app user works without sudo
        run: |
          docker exec ci bash -c '
            set -eux
            ! command -v sudo
            export ANSIBLE_CONFIG=/repo/ansible.cfg
            ansible -i inventory/local.yml localhost \
              --become --become-user devuser \
              -m command -a "id -un" | tee /tmp/become
            grep -q devuser /tmp/become
          '

      # --only is what somebody reaches for to repair one step on a box that is
      # already provisioned, and it is the reason the playbooks carry per-role
      # tags instead of declaring role dependencies. It has its own failure mode
      # — a tag that matches nothing runs an empty play and exits 0 — so assert
      # that a single-role run actually does the role.
      - name: a single-role run still converges
        run: docker exec ci ./test/install-check.sh --only user

      - name: teardown
        if: always()
        run: docker rm -f ci || true
